services:
  xeno-node:
    image: "${XENO_REGISTRY:-}${XENO_NODE_IMAGE:-xeno-node}:${XENO_VERSION:-latest}"
    container_name: xeno-node
    build:
      context: .
      dockerfile: Dockerfile.xeno-node
    ports:
      - "${XENO_NODE_RPC_PORT:-16110}:${XENO_NODE_RPC_PORT:-16110}"
      - "${XENO_NODE_P2P_PORT:-16111}:${XENO_NODE_P2P_PORT:-16111}"
      - "${XENO_MINER_RPC_PORT:-17110}:${XENO_MINER_RPC_PORT:-17110}"
    volumes:
      - "${XENO_DATA_DIR:-./devnet-data}/node:/root/.rusty-xenom"
    environment:
      - RUST_LOG=${XENO_LOG_LEVEL:-info}
      - XENO_NODE_RPC_PORT=${XENO_NODE_RPC_PORT:-16110}
      - XENO_NODE_P2P_PORT=${XENO_NODE_P2P_PORT:-16111}
      - XENO_MINER_RPC_PORT=${XENO_MINER_RPC_PORT:-17110}
      - XENO_NODE_EXTRA_ARGS=${XENO_NODE_EXTRA_ARGS:---devnet}
      - XENO_NODE_ADDPEERS=${XENO_NODE_ADDPEERS:-}
      - XENO_LORA=${XENO_LORA:-}
      - XENO_LORA_RANK=${XENO_LORA_RANK:-8}
      - XENO_LORA_ALPHA=${XENO_LORA_ALPHA:-16}
      - XENO_LORA_DROPOUT=${XENO_LORA_DROPOUT:-0}
      - XENO_LORA_TARGET_MODULES=${XENO_LORA_TARGET_MODULES:-query,key,value,transform_dense,up_proj,down_proj}
    command:
      - --devnet
      - --rpclisten=0.0.0.0:${XENO_NODE_RPC_PORT:-16110}
      - --listen=0.0.0.0:${XENO_NODE_P2P_PORT:-16111}
      - --miner-ws-listen=0.0.0.0:${XENO_MINER_RPC_PORT:-17110}
      - --models-dir=/root/.rusty-xenom/models
      - --disable-upnp
      - --nodnsseed
    networks:
      - xeno-devnet
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/${XENO_NODE_RPC_PORT:-16110}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  xeno-miner:
    image: "${XENO_REGISTRY:-}${XENO_MINER_IMAGE:-xeno-miner}:${XENO_VERSION:-latest}"
    container_name: xeno-miner
    build:
      context: .
      dockerfile: Dockerfile.xeno-miner
    volumes:
      - "${XENO_DATA_DIR:-./devnet-data}/miner:/root/.xenom-miner"
    environment:
      - RUST_LOG=${XENO_LOG_LEVEL:-info}
      - XENO_WALLET_PASSWORD=${XENO_WALLET_PASSWORD:-devnet-password}
      - XENO_MINER_RPC_URL=ws://xeno-node:${XENO_MINER_RPC_PORT:-17110}
      - XENO_MINER_MODEL_ID=${XENO_MINER_MODEL_ID:-multimolecule/dnabert2}
      - XENO_MINER_THREADS=${XENO_MINER_THREADS:-4}
      - XENO_MINER_DATA_DIR=/root/.xenom-miner
      - XENO_MINER_TRAINER=${XENO_MINER_TRAINER:-dnabert2}
      - XENO_MINER_EXTRA_ARGS=${XENO_MINER_EXTRA_ARGS:---network devnet}
    networks:
      - xeno-devnet
    depends_on:
      xeno-node:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G

  anvil:
    image: "${XENO_ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:stable}"
    container_name: xeno-anvil
    ports:
      - "${XENO_ANVIL_PORT:-8545}:8545"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec anvil --host=0.0.0.0 --port=8545 --block-time=${XENO_BLOCK_TIME:-12} \
          $([ -n "${XENO_FORK_URL:-}" ] && printf '%s' "--fork-url=${XENO_FORK_URL} ") \
          $([ -n "${XENO_FOUNDRY_MNEMONIC:-}" ] && printf '%s' "--mnemonic='${XENO_FOUNDRY_MNEMONIC}' ")
    networks:
      - xeno-devnet
    profiles:
      - evm

networks:
  xeno-devnet:
    driver: bridge
