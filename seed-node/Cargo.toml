[package]
name = "seed-node"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.10"
borsh = "0.10"
borsh-derive = "0.10"
blake3 = "1.5"
ethers = { version = "2.0", features = ["rustls"] }
redis = { version = "0.23", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["trace", "cors"] }
prost = "0.12"
tokio-stream = "0.1"
h2 = "0.3"
hyper = "0.14"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = "0.4"
bincode = "1.3"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
tonic-build = "0.10"
