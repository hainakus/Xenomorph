[package]
name = "seed-node"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.10"
borsh = { workspace = true }
kaspa-addresses = { workspace = true }
kaspa-consensus-core = { workspace = true }
kaspa-core = { workspace = true }
kaspa-p2p-lib = { workspace = true }
kaspa-utils-tower = { workspace = true }
model-crypto = { path = "../crypto/model-crypto" }
xenom-quic = { path = "../xenom-quic" }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
blake3 = "1.5"
local-ip-address = "0.6.1"
xenom-miner = { path = "../xenom-miner" }
mini-genome-model = { path = "../mini-genome-model" }
candle-core = { version = "0.3", default-features = false }
candle-nn = { version = "0.3", default-features = false }
safetensors = "0.4"
futures = "0.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
ethers = { version = "2.0", features = ["rustls"] }
redis = { version = "0.23", features = ["tokio-comp"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
quinn = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["trace", "cors"] }
prost = "0.12"
tokio-stream = "0.1"
h2 = "0.3"
hyper = "0.14"
chrono = "0.4"
bincode = "1.3"
rand = "0.8"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3.9"
tokenizers = "0.21"

[build-dependencies]
tonic-build = "0.10"
