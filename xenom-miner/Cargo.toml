[package]
name = "xenom-miner"
version = "0.1.0"
edition = "2021"
authors = ["Xenom Team"]
description = "UsefulPoW Miner for Xenomorph Blockchain"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"

# Serialization (Borsh para Xenomorph)
borsh = { workspace = true }

# Crypto
blake3 = "1.5"
model-crypto = { path = "../crypto/model-crypto" }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"

# ML
# Use --features cuda / metal to enable GPU backends. CPU is always available.
candle-core = { version = "0.3", default-features = false }
candle-nn = { version = "0.3", default-features = false }
candle-transformers = "0.3"
mini-genome-model = { path = "../mini-genome-model" }
safetensors = "0.4"
# Pin half so its rand_distr feature uses the same rand 0.8 as candle-core.
half = "=2.4.1"
tokenizers = "0.21.4"

# Multi-GPU / distributed training helpers
rayon = "1.8"
async-trait = "0.1"

# GPU monitoring (NVIDIA via NVML). Only compiled with the 'cuda' feature.
nvml-wrapper = { version = "0.9", optional = true }

# Wallet
secp256k1 = { version = "0.28", features = ["global-context", "rand-std"] }
bip39 = "2.0"
bip32 = "0.5"

# Consensus parameters (genome merkle root, network defaults)
kaspa-consensus-core = { workspace = true }
kaspa-addresses = { workspace = true }

# On-chain governance
ethers = { version = "2.0", features = ["rustls"] }

# Networking
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
chrono = "0.4"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
futures = "0.3"
url = "2.5"

[features]
default = ["cpu"]
cpu = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:nvml-wrapper"]
metal = ["candle-core/metal", "candle-nn/metal"]
rocm = []
multi-gpu = ["cuda"]
nccl = ["multi-gpu"]

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.12"
tempfile = "3.8"

[[bin]]
name = "xenom-miner"
path = "src/main.rs"
