[package]
name = "xenom-integration-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core crates
xenom-miner = { path = "../xenom-miner" }
seed-node = { path = "../seed-node" }
api-gateway = { path = "../api-gateway" }

# Async
tokio = { version = "1.35", features = ["full", "test-util"] }
tokio-test = "0.4"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures = "0.3"

# Serialization (must match xenom-miner's borsh 1.x)
borsh = { version = "1.2", features = ["derive"] }

# Ethereum
ethers = { version = "2.0", features = ["rustls", "abigen"] }

# Testing
serial_test = "3.0"
tempfile = "3.9"

# Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hex = "0.4"
sha3 = "0.10"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "integration"
path = "integration/main.rs"
